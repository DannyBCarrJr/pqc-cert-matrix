[package]
name = "pqm-rustls-client"
version = "0.1.0"
edition = "2021"

# Default features on purpose: this column measures stock rustls, i.e. what a
# developer gets from `cargo add rustls` without opting into unstable PQ work.
[dependencies]
rustls = "0.23"
rustls-pemfile = "2"
webpki = { package = "rustls-webpki", version = "0.103", features = ["aws-lc-rs"] }

[[bin]]
name = "client"
path = "src/main.rs"
